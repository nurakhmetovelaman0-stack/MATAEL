name: MATAEL Build and Word Document

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and DOCX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Install DOCX library
        run: python3 -m pip install --user python-docx

      - name: Generate Word document
        run: python3 .github/scripts/build_matael_doc.py

      - name: Upload APK and DOCX
        uses: actions/upload-artifact@v4
        with:
          name: MATAEL-APK-and-DOCX
          path: |
            app/build/outputs/apk/debug/*.apk
            MATAEL_Исходный_код_и_требования.docx
          if-no-files-found: error
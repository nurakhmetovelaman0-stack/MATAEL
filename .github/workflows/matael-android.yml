name: MATAEL Android Build

on:
workflow_dispatch:
push:
branches:
- main
paths:
- '/*.java'
- '/.kt'
- '**/.kts'
- '/*.xml'
- '/.gradle'
- '**/.properties'
- '.github/workflows/matael-android.yml'

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Verify project files
    run: |
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts
      test -f app/src/main/AndroidManifest.xml

  - name: Build Debug APK
    run: gradle --no-daemon :app:assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MATAEL-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14